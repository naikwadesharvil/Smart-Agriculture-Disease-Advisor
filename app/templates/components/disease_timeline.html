<!-- ==========================================
     Disease Timeline
========================================== -->

<section class="mb-5">

    <div class="custom-card dashboard-card">

        <div class="d-flex align-items-center mb-4">

            <i class="bi bi-clock-history display-6 text-success me-3"></i>

            <div>

                <h2 class="mb-0">

                    Disease Progress Timeline

                </h2>

                <p class="mb-0">

                    Understand how the disease develops over time.

                </p>

            </div>

        </div>

        <div class="timeline">

            <!-- Early Stage -->

            <div class="timeline-item">

                <div class="timeline-dot bg-success">

                    <i class="bi bi-1-circle-fill"></i>

                </div>

                <div class="timeline-content">

                    <h4 class="text-success">

                        Early Stage

                    </h4>

                    <p>

                        {{ info.Age_Cycle.Early }}

                    </p>

                </div>

            </div>

            <!-- Moderate Stage -->

            <div class="timeline-item">

                <div class="timeline-dot bg-warning">

                    <i class="bi bi-2-circle-fill"></i>

                </div>

                <div class="timeline-content">

                    <h4 class="text-warning">

                        Moderate Stage

                    </h4>

                    <p>

                        {{ info.Age_Cycle.Moderate }}

                    </p>

                </div>

            </div>

            <!-- Severe Stage -->

            <div class="timeline-item">

                <div class="timeline-dot bg-danger">

                    <i class="bi bi-3-circle-fill"></i>

                </div>

                <div class="timeline-content">

                    <h4 class="text-danger">

                        Severe Stage

                    </h4>

                    <p>

                        {{ info.Age_Cycle.Severe }}

                    </p>

                </div>

            </div>

            <!-- Estimated Progress -->

            <div class="timeline-item">

                <div class="timeline-dot bg-primary">

                    <i class="bi bi-calendar-check-fill"></i>

                </div>

                <div class="timeline-content">

                    <h4 class="text-primary">

                        Estimated Disease Duration

                    </h4>

                    <p>

                        {{ info.Age_Cycle.Estimated }}

                    </p>

                </div>

            </div>

        </div>

    </div>

</section>
