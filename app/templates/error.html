{% extends "base.html" %}


{% block title %}
Error | Smart Agriculture Disease Advisor
{% endblock %}


{% block content %}

<!-- ==========================================
     ERROR PAGE
     ========================================== -->

<div
    class="row justify-content-center align-items-center"
    style="min-height: 65vh;">

    <div class="col-lg-7 col-md-9">

        <div
            class="custom-card text-center"
            data-aos="zoom-in">


            <!-- ================= ICON ================= -->

            <div class="mb-4">

                <i
                    class="bi bi-exclamation-triangle-fill text-danger"
                    style="font-size: 5rem;">
                </i>

            </div>


            <!-- ================= TITLE ================= -->

            <h1 class="fw-bold text-danger mb-3">

                Something Went Wrong

            </h1>


            <!-- ================= ERROR MESSAGE ================= -->

            <p class="lead text-muted mb-4">

                {{ error }}

            </p>


            <!-- ================= ACTIONS ================= -->

            <div
                class="d-flex justify-content-center gap-3 flex-wrap">


                <a
                    href="{{ url_for('home') }}"
                    class="btn btn-success btn-lg">

                    <i class="bi bi-house-fill"></i>

                    Back to Home

                </a>


                <a
                    href="{{ url_for('guide') }}"
                    class="btn btn-outline-success btn-lg">

                    <i class="bi bi-book"></i>

                    View Guide

                </a>

            </div>


            <!-- ================= HELP TEXT ================= -->

            <hr class="my-4">


            <p class="small text-muted mb-0">

                Please make sure your image is a valid
                JPG, JPEG, or PNG file and try again.

            </p>

        </div>

    </div>

</div>

{% endblock %}
